version: 2
updates:
  # Update GitHub Actions (actions/checkout, actions/deploy-pages, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Update Go modules (docsy theme)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "go-modules"
    groups:
      go-modules:
        patterns:
          - "*"

  # Update npm dependencies (autoprefixer, postcss, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
    ignore:
      # Versions come from the Docsy Hugo module (hugo mod npm pack) and are
      # regenerated in CI; bump them by upgrading Docsy through gomod instead.
      - dependency-name: "bootstrap"
      - dependency-name: "@fortawesome/fontawesome-free"
    groups:
      npm-dependencies:
        patterns:
          - "*"
