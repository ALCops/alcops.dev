blank_issues_enabled: true
contact_links:
  - name: ✏️ Fix it yourself with a pull request
    url: https://github.com/ALCops/alcops.dev/blob/main/CONTRIBUTING.md
    about: Spotted a typo or something that isn't right? PRs are more than welcome, no issue needed. See CONTRIBUTING.md to get started.
  - name: 🐛 Analyzer bug (PlatformCop, LinterCop, ApplicationCop, ...)
    url: https://github.com/ALCops/Analyzers/issues/new/choose
    about: False positive, false negative, or crash in an analyzer rule? That's the Analyzers repository, not the documentation.
  - name: 🧩 VS Code extension issue
    url: https://github.com/ALCops/vscode-extension/issues/new/choose
    about: Issues with the ALCops VS Code extension belong in its own repository.
  - name: 🚀 Azure DevOps extension issue
    url: https://github.com/ALCops/azure-devops-extension/issues/new/choose
    about: Issues with the ALCops Azure DevOps pipeline extension belong in its own repository.
  - name: 🤖 MCP server issue
    url: https://github.com/ALCops/mcp-server/issues/new/choose
    about: Issues with the ALCops MCP server belong in its own repository.
